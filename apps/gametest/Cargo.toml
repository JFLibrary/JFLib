[package]
name = "gametest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "gametest"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
base.workspace = true
physics.workspace = true
game.workspace = true
# the netcode's tests: netchan's cores on the simulated link (src/net_*.rs), its sockets for --loopback
netchan.workspace = true
# the bridge against render3d offscreen (src/bridge.rs); ui: the probe window the scripts drive (src/probe.rs)
game_render3d.workspace = true
render3d.workspace = true
gpu.workspace = true
ui.workspace = true
# (G7b part 2) the asset tests make their glTF and PNG files (src/asset_t.rs)
gltf.workspace = true
img_png.workspace = true
style = { package = "jflib-style-winui", path = "../../styles/winui" }

[build-dependencies]
jflib-build.workspace = true
