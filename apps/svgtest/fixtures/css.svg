<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" color="#7c3aed">
  <title>CSS</title>
  <style type="text/css"><![CDATA[
    /* type, class, id, descendant and child selectors; specificity and order */
    rect { fill: #9ca3af; stroke: none }
    .warm { fill: #f97316 }
    .cold { fill: #0ea5e9; stroke: #0c4a6e; stroke-width: 3px }
    #special { fill: #dc2626 }
    g.box > rect { stroke: black; stroke-width: 2 }
    g.box circle { fill: currentColor }
    .big.round { rx: 20; fill: #22c55e }
    [data-x] { opacity: 0.5 }
    @media print { rect { fill: black } }
    rect:hover { fill: magenta }
  ]]></style>
  <rect x="10" y="10" width="50" height="40"/>
  <rect x="75" y="10" width="50" height="40" class="warm"/>
  <rect x="140" y="10" width="50" height="40" class="warm cold"/>
  <rect x="10" y="60" width="50" height="40" class="warm" id="special"/>
  <rect x="75" y="60" width="50" height="40" class="cold" style="fill: gold"/>
  <rect x="140" y="60" width="50" height="40" fill="blue" class="warm"/>
  <g class="box">
    <rect x="10" y="115" width="80" height="70" fill="white"/>
    <circle cx="50" cy="150" r="20"/>
  </g>
  <rect x="110" y="115" width="80" height="35" class="big round" rx="20"/>
  <rect x="110" y="155" width="80" height="35" data-x="1" style="fill:#1d4ed8;stroke:#1e3a8a;stroke-width:4"/>
</svg>
