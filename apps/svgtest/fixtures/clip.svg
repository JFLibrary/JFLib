<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Beschneidung</title>
  <defs>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
    <clipPath id="two">
      <rect x="110" y="10" width="35" height="80"/>
      <circle cx="160" cy="50" r="30"/>
    </clipPath>
    <clipPath id="bbox" clipPathUnits="objectBoundingBox">
      <ellipse cx="0.5" cy="0.5" rx="0.5" ry="0.3"/>
    </clipPath>
    <clipPath id="star" clip-rule="evenodd">
      <path d="M50 110 L65 190 L20 135 L80 135 L35 190 Z" clip-rule="evenodd"/>
    </clipPath>
    <clipPath id="inner" clip-path="url(#circle)">
      <rect x="10" y="10" width="45" height="80"/>
    </clipPath>
    <linearGradient id="g" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#g)" clip-path="url(#circle)"/>
  <rect x="0" y="0" width="100" height="100" fill="black" opacity="0.25" clip-path="url(#inner)"/>
  <g clip-path="url(#two)">
    <rect x="100" y="0" width="100" height="100" fill="#f59e0b"/>
    <path d="M100 0 L200 100 M200 0 L100 100" stroke="#78350f" stroke-width="6"/>
  </g>
  <rect x="110" y="120" width="80" height="60" fill="#0ea5e9" clip-path="url(#bbox)"/>
  <rect x="10" y="105" width="80" height="90" fill="#16a34a" clip-path="url(#star)"/>
</svg>
