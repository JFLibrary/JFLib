<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Transformationen</title>
  <defs>
    <path id="arrow" d="M0 -8 L20 -8 L20 -16 L36 0 L20 16 L20 8 L0 8 Z"/>
  </defs>
  <g transform="translate(20 30)">
    <use href="#arrow" fill="#2563eb"/>
    <use href="#arrow" fill="#16a34a" transform="translate(60, 0) scale(1.5)"/>
    <use href="#arrow" fill="#dc2626" transform="translate(140 0) scale(-1 1) translate(-20 0)"/>
  </g>
  <g transform="translate(50 110)">
    <rect x="-20" y="-20" width="40" height="40" fill="#f59e0b" opacity="0.4"/>
    <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#b45309" stroke-width="2" transform="rotate(30)"/>
    <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#7c2d12" stroke-width="2" transform="rotate(-15, 20, 20)"/>
  </g>
  <rect x="100" y="90" width="40" height="40" fill="#8b5cf6" transform="skewX(20)"/>
  <rect x="150" y="70" width="40" height="40" fill="#ec4899" transform="skewY(15)"/>
  <!-- matrix(a b c d e f): a rotation by 30 degrees and a move -->
  <g transform="matrix(0.866 0.5 -0.5 0.866 100 140)">
    <rect width="60" height="20" fill="#0d9488"/>
    <text x="4" y="15" font-size="14" fill="white">matrix</text>
  </g>
  <g transform="translate(20 160) scale(0.5)" stroke="#111" stroke-width="4" fill="none">
    <circle cx="20" cy="20" r="18"/>
  </g>
</svg>
