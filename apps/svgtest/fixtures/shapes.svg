<?xml version="1.0" encoding="UTF-8"?>
<!-- basic shapes: rect with rx / ry, circle, ellipse, line, polyline, polygon -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Grundformen</title>
  <rect x="10" y="10" width="80" height="50" fill="#3b82f6"/>
  <rect x="110" y="10" width="80" height="50" rx="12" fill="tomato" stroke="#7f1d1d" stroke-width="3"/>
  <rect x="10" y="70" width="80" height="50" rx="30" ry="10" fill="none" stroke="seagreen" stroke-width="4"/>
  <circle cx="150" cy="95" r="25" fill="gold" stroke="black" stroke-width="2"/>
  <ellipse cx="50" cy="155" rx="40" ry="20" fill="rgb(150, 50, 200)"/>
  <line x1="100" y1="135" x2="190" y2="135" stroke="black" stroke-width="2"/>
  <polyline points="100,190 115,150 130,180 145,145 160,175 175,150 190,190" fill="none" stroke="#0891b2" stroke-width="3"/>
  <polygon points="100,195 190,195 145,185" fill="hsl(330, 80%, 50%)"/>
</svg>
