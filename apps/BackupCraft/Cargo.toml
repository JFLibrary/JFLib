[package]
name = "BackupCraft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "BackupCraft"
path = "src/main.rs"
test = false
bench = false

[lints]
