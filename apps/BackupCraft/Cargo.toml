[dependencies]
plat.workspace = true
base.workspace = true
ui.workspace = true
datetime.workspace = true
crypto.workspace = true
netio.workspace = true
bc_proto = { path = "crates/bc_proto" }
style = { package = "jflib-style-backupcraft", path = "../../styles/backupcraft" }

[build-dependencies]
jflib-build.workspace = true
