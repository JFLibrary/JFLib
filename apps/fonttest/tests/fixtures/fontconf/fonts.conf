<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- the rules of fonttest --selftest (text/fontconf.rs): <alias> in comments is no rule -->
<fontconfig>
  <description>fonttest rules</description>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>jfgui Missing</family>
      <family>jfgui Mini</family>
    </prefer>
    <default><family>jfgui Mac</family></default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>jfgui CID</family></prefer>
    <accept><family>Accept One</family></accept>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept><family>Accept Two</family></accept>
  </alias>
  <alias>
    <family>Helvetica &amp; Co</family>
    <accept><family>jfgui Mini CFF</family></accept>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JP Font</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>TC Font</string></edit>
  </match>
  <match target="pattern">
    <test name="charset"><charset><int>0x3000</int></charset></test>
    <edit name="family" mode="prepend"><string>Never</string></edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
  <include ignore_missing="yes">conf.d</include>
  <include ignore_missing="yes">missing.conf</include>
</fontconfig>
