<?xml version="1.0"?>
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer><family>Mono A</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>Old Name</string></test>
    <edit name="family" mode="assign"><string>jfgui Mac</string></edit>
  </match>
</fontconfig>
