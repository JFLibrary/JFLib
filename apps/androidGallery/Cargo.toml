[package]
name = "androidGallery"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "androidGallery"
path = "main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
plat.workspace = true
gfx.workspace = true
ui.workspace = true
style = { package = "jflib-style-winui", path = "../../styles/winui" }
# (G5e2) the page "3D-Ansicht" (pg_view.rs): a render3d scene in a view; its check takes render3dtest's geometry and ray
# caster (common.rs, cpu.rs, gltfgen.rs, included as they are), which need gltf and the image crates
gpu.workspace = true
render3d.workspace = true
gltf.workspace = true
img_core.workspace = true
img_jpeg.workspace = true

[build-dependencies]
jflib-build.workspace = true
