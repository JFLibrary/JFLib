[package]
name = "androidGallery"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "androidGallery"
path = "main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
plat.workspace = true
gfx.workspace = true
ui.workspace = true
style = { package = "jflib-style-winui", path = "../../styles/winui" }
# (G5e2) the page "3D-Ansicht" (pg_view.rs): a render3d scene in a view; its check takes render3dtest's geometry and ray
# caster (common.rs, cpu.rs, gltfgen.rs, included as they are), which need gltf and the image crates
gpu.workspace = true
render3d.workspace = true
gltf.workspace = true
img_core.workspace = true
img_jpeg.workspace = true
# (G6e3) the page "2D-Zeichnung" (pg_r2d.rs, Android): a render2d drawing in a view, its check against the CPU path on
# the device's GPU and its measurement take render2dtest's drawings (gallery.rs, textdraw.rs, hlov.rs, cad.rs, included as
# they are); elsewhere unused (main.rs: use render2d as _), build_rs.py's derived workspaces take [dependencies] only
render2d.workspace = true

[build-dependencies]
jflib-build.workspace = true
