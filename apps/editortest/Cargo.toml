[package]
name = "editortest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "editortest"
path = "main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
plat.workspace = true
ui.workspace = true
script = { path = "../jfs/crates/script" }
style = { package = "jflib-style-winui", path = "../../styles/winui" }

[build-dependencies]
jflib-build.workspace = true
