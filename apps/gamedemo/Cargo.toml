[package]
name = "gamedemo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "gamedemo"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
physics.workspace = true
game.workspace = true
game_render3d.workspace = true
render3d.workspace = true
gpu.workspace = true
gfx.workspace = true
ui.workspace = true
# (G7b part 2) the HUD's shader of the own-swapchain path (own.rs), compiled where the program starts
shader.workspace = true
wgsl.workspace = true
style = { package = "jflib-style-winui", path = "../../styles/winui" }

[build-dependencies]
jflib-build.workspace = true
