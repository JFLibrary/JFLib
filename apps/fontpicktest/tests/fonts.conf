<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontpicktest: the generic families on the fonts in the repository (jfgui_FONTCONF):
     lib/doc_view/assets (DejaVu) and apps/fonttest/tests/fixtures (the jfgui test fonts) -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>jfgui Mini</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <accept><family>jfgui Mac</family></accept>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>jfgui CID</string></edit>
  </match>
</fontconfig>
