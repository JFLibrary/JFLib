[package]
name = "nettest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "nettest"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
netchan.workspace = true

# the server side, netio's WebSocket and the loopback tests (netio is not built for the browser and
# Android)
[target.'cfg(windows)'.dependencies]
netio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
netio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
netio.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
netio.workspace = true

[build-dependencies]
jflib-build.workspace = true
