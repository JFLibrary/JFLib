[package]
name = "JFDiagrammer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "JFDiagrammer"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
ui.workspace = true
base.workspace = true
plat.workspace = true
rt.workspace = true
# (JD4) reading drawings, their display list, drawing it (render2d's camera), installed fonts
diagram_core.workspace = true
diagram_io.workspace = true
diagram_view.workspace = true
render2d.workspace = true
text.workspace = true
style = { package = "jflib-style-netlab", path = "../../styles/netlab" }

[build-dependencies]
jflib-build.workspace = true
