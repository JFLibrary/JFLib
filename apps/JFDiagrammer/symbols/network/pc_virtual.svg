<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="256" height="192"
     fill="none" stroke="#2E343B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
  <title>Virtual PC: monitor and tower with the VM badge (two offset squares)</title>
  <!-- monitor -->
  <rect class="shade" x="19" y="33" width="6" height="6" fill="#DCDFE3"/>
  <rect class="body" x="12" y="39" width="20" height="3.5" rx="1.5" fill="#F7F8FA"/>
  <rect class="body" x="3" y="5" width="38" height="29" rx="2" fill="#F7F8FA" stroke="none"/>
  <path class="tint" d="M3 29H41V32A2 2 0 0 1 39 34H5A2 2 0 0 1 3 32Z" fill="#7A828C" stroke="none"/>
  <rect class="screen" x="6" y="8" width="32" height="18.5" fill="#CAD4DF" stroke="none"/>
  <rect class="ink" x="3" y="5" width="38" height="29" rx="2"/>
  <!-- tower -->
  <rect class="body" x="46" y="8" width="10.5" height="34.5" rx="1.5" fill="#F7F8FA"/>
  <rect class="shade" x="48" y="11.5" width="6.5" height="3" rx="0.5" fill="#DCDFE3" stroke-width="1"/>
  <path class="port" d="M48.5 19H54M48.5 21.5H54" stroke="#4F555D" stroke-width="1"/>
  <!-- the VM badge: a disc in the category's colour, a light ring, two offset squares in white -->
  <circle class="tint body" cx="52.5" cy="36" r="9.25" fill="#7A828C" stroke="#F7F8FA" stroke-width="1.5"/>
  <g class="body" stroke="#F7F8FA" stroke-width="1.2">
    <rect x="47.75" y="31.25" width="6.5" height="6.5" rx="0.75"/>
    <rect class="body body" x="50.75" y="34.25" width="6.5" height="6.5" rx="0.75" fill="#F7F8FA"/>
  </g>
</svg>
