<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220">
  <title>Layers</title>
  <rect x="1" y="1" width="618" height="218" rx="8" fill="#F4F6F8" stroke="#C4CBD3" stroke-width="2"/>
  <rect x="20" y="18" width="580" height="40" rx="4" fill="#DDF0E4" stroke="#2F7D4F" stroke-width="2"/>
  <text x="36" y="44" font-family="sans-serif" font-size="14" text-anchor="start" fill="#2B3640" font-weight="bold">Application</text>
  <text x="586" y="44" font-family="monospace" font-size="12.5" text-anchor="end" fill="#2B3640">curl, dig</text>
  <rect x="20" y="64" width="580" height="40" rx="4" fill="#CFE0F1" stroke="#3A6EA5" stroke-width="2"/>
  <text x="36" y="90" font-family="sans-serif" font-size="14" text-anchor="start" fill="#2B3640" font-weight="bold">Paths (IP)</text>
  <text x="586" y="90" font-family="monospace" font-size="12.5" text-anchor="end" fill="#2B3640">ping, traceroute, ip route</text>
  <rect x="20" y="110" width="580" height="40" rx="4" fill="#F6ECDD" stroke="#A9702A" stroke-width="2"/>
  <text x="36" y="136" font-family="sans-serif" font-size="14" text-anchor="start" fill="#2B3640" font-weight="bold">Frames (MAC)</text>
  <text x="586" y="136" font-family="monospace" font-size="12.5" text-anchor="end" fill="#2B3640">ip neigh, show mac address-table</text>
  <rect x="20" y="156" width="580" height="40" rx="4" fill="#E7EAEE" stroke="#44515E" stroke-width="2"/>
  <text x="36" y="182" font-family="sans-serif" font-size="14" text-anchor="start" fill="#2B3640" font-weight="bold">Cables and ports</text>
  <text x="586" y="182" font-family="monospace" font-size="12.5" text-anchor="end" fill="#2B3640">ip link, show ip interface brief</text>
</svg>
