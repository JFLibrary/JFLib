<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220">
  <title>How a host decides</title>
  <rect x="1" y="1" width="618" height="218" rx="8" fill="#F4F6F8" stroke="#C4CBD3" stroke-width="2"/>
  <rect x="40" y="68" width="60" height="36" rx="4" fill="#FFFFFF" stroke="#44515E" stroke-width="2.5"/>
  <rect x="46" y="74" width="48" height="24" rx="1" fill="#CFE0F1" stroke="#CFE0F1" stroke-width="0"/>
  <rect x="58" y="104" width="24" height="6" rx="0" fill="#44515E" stroke="#44515E" stroke-width="0"/>
  <text x="70" y="130" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2B3640" font-weight="bold">PC1</text>
  <rect x="160" y="58" width="200" height="60" rx="8" fill="#F6ECDD" stroke="#A9702A" stroke-width="2"/>
  <text x="260" y="84" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2B3640" font-weight="bold">Destination in own network?</text>
  <text x="260" y="104" font-family="monospace" font-size="12" text-anchor="middle" fill="#2B3640">&amp; mask</text>
  <path d="M104 88 L147 88" fill="none" stroke="#44515E" stroke-width="2.5"/>
  <path d="M158.0 88.0 L147.0 82.0 L147.0 94.0 Z" fill="#44515E"/>
  <path d="M360 76 L391.41 50.8716" fill="none" stroke="#2F7D4F" stroke-width="3"/>
  <path d="M400.0 44.0 L387.7 46.2 L395.2 55.6 Z" fill="#2F7D4F"/>
  <path d="M360 100 L393.293 143.281" fill="none" stroke="#3A6EA5" stroke-width="3"/>
  <path d="M400.0 152.0 L398.0 139.6 L388.5 146.9 Z" fill="#3A6EA5"/>
  <text x="372" y="52" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2F7D4F" font-weight="bold">yes</text>
  <text x="366" y="142" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#3A6EA5" font-weight="bold">no</text>
  <rect x="404" y="22" width="200" height="48" rx="4" fill="#DDF0E4" stroke="#2F7D4F" stroke-width="2"/>
  <text x="504" y="42" font-family="sans-serif" font-size="12.5" text-anchor="middle" fill="#2B3640" font-weight="bold">directly:</text>
  <text x="504" y="60" font-family="sans-serif" font-size="12.5" text-anchor="middle" fill="#2B3640">ARP for the destination</text>
  <rect x="404" y="132" width="200" height="48" rx="4" fill="#CFE0F1" stroke="#3A6EA5" stroke-width="2"/>
  <text x="504" y="152" font-family="sans-serif" font-size="12.5" text-anchor="middle" fill="#2B3640" font-weight="bold">through the gateway:</text>
  <text x="504" y="170" font-family="sans-serif" font-size="12.5" text-anchor="middle" fill="#2B3640">ARP for the router</text>
</svg>
