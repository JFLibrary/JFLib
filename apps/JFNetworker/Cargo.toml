[package]
name = "JFNetworker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "JFNetworker"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
agent_core.workspace = true
plat.workspace = true
base.workspace = true
gfx.workspace = true
img_core.workspace = true
fx.workspace = true
img_svg.workspace = true
img_all.workspace = true
ui.workspace = true
datetime.workspace = true
crypto.workspace = true
netpkt.workspace = true
eapm.workspace = true
jfn_model = { path = "crates/jfn_model" }
script = { path = "../jfs/crates/script" }
jfn_sim = { path = "crates/jfn_sim" }
jfn_run = { path = "crates/jfn_run" }
style = { package = "jflib-style-netlab", path = "../../styles/netlab" }

[build-dependencies]
jflib-build.workspace = true
