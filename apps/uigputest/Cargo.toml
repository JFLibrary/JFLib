[package]
name = "uigputest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "uigputest"
path = "main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
gfx.workspace = true
ui.workspace = true
shader.workspace = true
wgsl.workspace = true
gpu.workspace = true
# (G5e1) a render3d scene in a view (view.rs); render3dtest's geometry and ray caster (common.rs, cpu.rs, gltfgen.rs
# included as they are) need gltf and the image crates
render3d.workspace = true
gltf.workspace = true
img_core.workspace = true
img_jpeg.workspace = true
style = { package = "jflib-style-winui", path = "../../styles/winui" }

[build-dependencies]
jflib-build.workspace = true
