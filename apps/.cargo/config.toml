# The apps of JFLib's repository built with Cargo itself, started in their folder (`cd apps/gallery`):
# what lib/jflib/template/.cargo/config.toml gives a project of its own.  build_rs.py sets its own
# flags (CARGO_ENCODED_RUSTFLAGS); the root of the repository has none, so that Cargo in lib/
# (cargo-jflib, the CI's checks and tests) builds as for any crate.
#
# Linux needs nothing here: a program with a window links against glibc through cc (rt, plat, gpu
# and ui pick that build in their build scripts), so `cargo run` is all it takes.  One static file
# takes "-C", "target-feature=+crt-static", "-C", "relocation-model=static" and --target.
