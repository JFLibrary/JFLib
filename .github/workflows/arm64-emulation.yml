# ARM0's side test (docs/ARM64.md): today's x64 programs under the emulation of Windows on ARM.
# They are built on an x64 runner, as on the PC. The same scripts run on x64 as well: a script that
# fails on both says something about the runner, one that fails only on ARM about the emulation.
# Started by hand only.
name: ARM64 emulation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust and LLD
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
          rustc --version
          "/c/Program Files/LLVM/bin/lld-link.exe" --version
      - name: Build
        run: |
          python -u build_rs.py app coretest --target win
          python -u build_rs.py app plattest --target win
          python -u build_rs.py app gallery --target win
      - uses: actions/upload-artifact@v4
        with:
          name: x64-programs
          retention-days: 7
          path: |
            build/win/**
            !build/win/inc/**
            !build/win/cargo-shaping/**
            !build/win/**/*.rlib
            !build/win/**/*.rmeta

  scripts:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: x64-programs
          path: build/win
      - name: The machine
        run: Get-CimInstance Win32_Processor | Format-List Name, Architecture, NumberOfLogicalProcessors
      - name: The desktop before the scripts
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $s = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen $($s.Width) x $($s.Height), $([System.Drawing.Graphics]::FromHwnd([IntPtr]::Zero).DpiX) dpi"
          $b = New-Object System.Drawing.Bitmap $s.Width, $s.Height
          [System.Drawing.Graphics]::FromImage($b).CopyFromScreen($s.Location, [System.Drawing.Point]::Empty, $s.Size)
          $b.Save("$PWD\build\desktop.png")
      - name: Scripts
        run: python -u tools/emulation_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pictures-${{ matrix.os }}
          retention-days: 7
          path: build/*.png
