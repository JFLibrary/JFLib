# JFLib on macOS and iOS (docs/APPLE.md AP8b) on GitHub's arm64 Mac runners, started by hand until it
# runs stable: the foundation's self-checks, the headless scripts of gallery and updatetest (the
# updater, also replacing an app bundle) on macOS, plattest's windowless tests, androidGallery's
# scripts in the iOS simulator, and a .dmg of BackupCraft as an artifact.  Windows of AppKit, the
# iPhone and signing with a certificate stay with the Mac at home (tools/apple.py; scripts never
# open a window, plattest --test window does).
#
# The job "intel" (docs/INTEL_MAC.md IM4) runs the Intel Macs' part on GitHub's last x86-64 image,
# macos-15-intel (announced to end around autumn 2027; then the job goes and the part stays built
# only, decision 4a): the only run on a real Intel processor (real x87, real AVX2; no usable GPU).
# Its x87 dump (artifact) compares with one of Windows x86-64: apps/portabletest/tests/x87_diff.py.
name: Apple

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: 1
  # one simulator booted for every script (tools/apple.py sim)
  jfgui_SIM_KEEP: "1"

jobs:
  mac:
    name: macOS and the iOS simulator
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rust and Xcode
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim --no-self-update
          rustup default stable
          rustc --version
          xcodebuild -version
          xcrun simctl list devices available | grep -m 3 iPhone || true
      # what the gallery's gpu scripts find here (2026-11-14: a virtual GPU, "Apple Paravirtual device" of family Apple4
      # at level Basis, and a screen too small for their windows, so they SKIP; docs/APPLE.md AP8b); information only,
      # never a failure (system_profiler SPDisplaysDataType says nothing on these runners)
      - name: The screen and the GPU
        run: |
          osascript -l JavaScript -e 'ObjC.import("AppKit"); var s = $.NSScreen.mainScreen; s.isNil() ? "no screen" : "screen " + s.frame.size.width + "x" + s.frame.size.height + ", visible " + s.visibleFrame.size.width + "x" + s.visibleFrame.size.height + ", scale " + s.backingScaleFactor' || true
          python build_rs.py app gputest --target mac
          build/mac/gputest --info || echo "gputest --info: exit $?"
      - name: coretest (the foundation's self-checks)
        run: python build_rs.py test coretest --target mac
      - name: gallery's scripts
        run: python build_rs.py test gallery --target mac
      - name: updatetest (checks, downloads, applying, rollback, app bundles)
        run: python build_rs.py test updatetest --target mac
      - name: plattest without windows
        run: |
          python build_rs.py app plattest --target mac
          for t in all cliprich spell; do
            echo "::group::plattest --test $t"
            build/mac/plattest --test "$t"
            echo "::endgroup::"
          done
      - name: androidGallery in the iOS simulator
        run: python build_rs.py test androidGallery --target ios --sim
      - name: A .dmg of BackupCraft
        run: python tools/package.py BackupCraft --formats dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BackupCraft-dmg
          path: build/dist/*.dmg
          retention-days: 7

  intel:
    name: Intel Macs (x86-64)
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rust, Xcode and the processor
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-apple-darwin --no-self-update
          rustup default stable
          rustc --version
          xcodebuild -version
          uname -m
          sysctl -n machdep.cpu.brand_string machdep.cpu.features
          sysctl -n machdep.cpu.leaf7_features || true
      - name: coretest (the foundation's self-checks)
        run: python build_rs.py test coretest --target mac --arch x86_64
      - name: gallery's scripts
        run: python build_rs.py test gallery --target mac --arch x86_64
      - name: updatetest (checks, downloads, applying, rollback, app bundles)
        run: python build_rs.py test updatetest --target mac --arch x86_64
      - name: plattest without windows, the processor and the crash report
        run: |
          python build_rs.py app plattest --target mac --arch x86_64
          for t in all cliprich spell cpu; do
            echo "::group::plattest --test $t"
            build/mac-x86_64/plattest --test "$t"
            echo "::endgroup::"
          done
          # the crash test ends with exit code 3 (the report's); its checks run in the hook
          set +e
          build/mac-x86_64/plattest --test crash > crash.txt 2>&1
          code=$?
          set -e
          cat crash.txt
          test "$code" = 3 && grep -q " 0 failure(s)" crash.txt
      - name: portabletest (SIMD backends, x87) and its x87 dump
        run: |
          python build_rs.py app portabletest --target mac --arch x86_64
          build/mac-x86_64/portabletest
          build/mac-x86_64/portabletest --simd sse2
          build/mac-x86_64/portabletest --math-dump > math-intel.txt
      - uses: actions/upload-artifact@v4
        with:
          name: x87-dump-intel
          path: math-intel.txt
          retention-days: 30
