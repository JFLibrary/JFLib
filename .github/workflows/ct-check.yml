# Constant time (tools/ct_check.py, SECURITY.md): lib/crypto's secret-dependent operations and netio's key
# files take the same way for every secret, traced under ptrace and run under valgrind's memcheck with the
# secret marked undefined, at the five optimization levels of JFLib's builds -- on x86-64 and on a real
# ARM64 machine (ubuntu-24.04-arm, Neoverse N2), where ptrace has no branch trap and the trace follows every
# instruction (15 to 40 minutes a level; also on an x86-64 runner whose virtual machine has no branch trap,
# the probe then switches by itself). The machine code is what is checked, and it changes with the
# compiler: hence Mondays as well, and x86-64 with both the rust-version and the newest stable Rust.
# A third set checks the wasm the compiler makes for the browser (ct_check.py --wasm, WABT's wasm-interp).
# Every level is a job of its own (ct_check.py --opt LEVEL): a level takes 15 to 70 minutes, the five in
# one job took up to 215 (x86-64, 1.98.1, 2026-11-24) of the 240 minutes it had.
# On a push to main or a pull request that touches the crypto, the key files or the tool; by hand.
name: Constant time

on:
  push:
    branches: [main]
    paths:
      - lib/crypto/**
      - lib/x509/**
      - lib/netio/pem.rs
      - lib/netio/ssh.rs
      - tools/ct_check.py
      - tools/ct_check/**
      - .github/workflows/ct-check.yml
  pull_request:
    paths:
      - lib/crypto/**
      - lib/x509/**
      - lib/netio/pem.rs
      - lib/netio/ssh.rs
      - tools/ct_check.py
      - tools/ct_check/**
      - .github/workflows/ct-check.yml
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: 1
  # the levels' lines as they come (a pipe would hold them until the end)
  PYTHONUNBUFFERED: 1

jobs:
  ct_check:
    name: ct_check ${{ matrix.machine.os }} (${{ matrix.machine.toolchain }}) ${{ matrix.level }}
    runs-on: ${{ matrix.machine.os }}
    # the longest level seen took 66 minutes (z on an x86-64 runner without the branch trap)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # the organization's plan runs 20 jobs at a time across its repositories: 9 here and 3 for wasm
      # leave the rest to the other workflows
      max-parallel: 9
      matrix:
        # the longest levels first, so that the short ones fill the gaps after them
        level: [z, s, o3, release, dev]
        # 1.98.1: the rust-version of the root Cargo.toml
        machine:
          - { os: ubuntu-latest, toolchain: "1.98.1" }
          - { os: ubuntu-latest, toolchain: stable }
          - { os: ubuntu-24.04-arm, toolchain: stable }
    steps:
      - uses: actions/checkout@v6
      - name: valgrind, binutils
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends valgrind binutils > /dev/null
          valgrind --version; addr2line --version | head -1
      - name: Rust
        run: |
          rustup toolchain install ${{ matrix.machine.toolchain }} --profile minimal --no-self-update
          rustup default ${{ matrix.machine.toolchain }}
          rustc --version
      - name: ct_check (trace and memcheck, ${{ matrix.level }})
        run: python3 tools/ct_check.py --opt ${{ matrix.level }}
      # what a report needs to be read elsewhere: memcheck's logs and the probes they came from
      # (addr2line or llvm-symbolizer on another machine, any architecture)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ct_check-${{ matrix.machine.os }}-${{ matrix.machine.toolchain }}-${{ matrix.level }}
          retention-days: 7
          path: |
            build/ct_check/*/memcheck-*.log
            build/ct_check/*/target/release/probe

  wasm:
    # the wasm the compiler makes for the browser (wasm32-unknown-unknown) in WABT's wasm-interp: the
    # executed instructions and the addresses of the memory accesses (ct_check.py --wasm)
    name: ct_check --wasm (stable) ${{ matrix.level }}
    runs-on: ubuntu-latest
    # a level takes 18 to 30 minutes
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        level: [z, s, o3, release, dev]
    steps:
      - uses: actions/checkout@v6
      - name: WABT
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wabt binutils > /dev/null
          wasm-interp --version
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable
          rustc --version
      - name: ct_check --wasm (${{ matrix.level }})
        run: python3 tools/ct_check.py --wasm --opt ${{ matrix.level }}
