[package]
name = "jflib-modplat"
description = "The platform layer of a loadable JFLib module, through its host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "modplat"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# the name its sources use; a module gets modrt as rt
rt = { package = "jflib-modrt", path = "../modrt", version = "=0.2.0" }

# docs.rs: Windows and Linux only (loadable modules exist on x86-64 Windows and Linux only), not docs.rs's five defaults
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
