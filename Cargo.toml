# The library's crates.  Cargo builds them for projects outside this repository; build_rs.py still
# compiles them with rustc itself and reads what it needs from here (tools/manifests.py).
# docs/CRATES.md is the plan, the apps get manifests in its stage CR3.
[workspace]
resolver = "3"
# worktrees below this folder may be older than this file, build/ holds test projects: their
# Cargo.toml are not members of it
exclude = [".claude", "build"]
default-members = ["lib/jflib"]
# lib/ in this order is build_rs.py's LIBS: a program's crates link in it
members = [
    "lib/rt",
    "lib/agent_core",
    "lib/plat",
    "lib/base",
    "lib/agent_io",
    "lib/simd",
    "lib/gfx",
    "lib/img_core",
    "lib/archive",
    "lib/doc_core",
    "lib/doc_layout",
    "lib/doc_io",
    "lib/img_png",
    "lib/text_shape",
    "lib/text",
    "lib/img_jpeg",
    "lib/img_bmp",
    "lib/img_gif",
    "lib/img_tga",
    "lib/img_tiff",
    "lib/img_webp",
    "lib/img_hevc",
    "lib/img_av1",
    "lib/img_heif",
    "lib/img_avif",
    "lib/img_jxl",
    "lib/img_jxl_enc",
    "lib/img_jxr",
    "lib/img_dds",
    "lib/img_pdn",
    "lib/fx",
    "lib/img_svg",
    "lib/img_all",
    "lib/spell",
    "lib/ui",
    "lib/doc_view",
    "lib/datetime",
    "lib/crypto",
    "lib/compress",
    "lib/shader",
    "lib/wgsl",
    "lib/netpkt",
    "lib/datastore",
    "lib/netio",
    "lib/cas",
    "lib/update",
    "lib/gpu",
    "lib/eapm",
    "lib/style_assets",
    "lib/jflib",
    "lib/jflib_build",
    "styles/winui",
    "styles/classic",
    "styles/kde",
    "styles/macos",
    "modules/modrt",
    "modules/modplat",
    "modules/jxlenc",
]

# The one version of the library (rt::VERSION; `build_rs.py release` writes it, docs/VERSIONING.md)
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JFLibrary/JFLib"

# Exact versions: only the way through the crate jflib is promised, the crates below it change together.
[workspace.dependencies]
rt = { package = "jflib-rt", path = "lib/rt", version = "=0.1.0" }
agent_core = { package = "jflib-agent-core", path = "lib/agent_core", version = "=0.1.0" }
plat = { package = "jflib-plat", path = "lib/plat", version = "=0.1.0" }
base = { package = "jflib-base", path = "lib/base", version = "=0.1.0" }
agent_io = { package = "jflib-agent-io", path = "lib/agent_io", version = "=0.1.0" }
simd = { package = "jflib-simd", path = "lib/simd", version = "=0.1.0" }
gfx = { package = "jflib-gfx", path = "lib/gfx", version = "=0.1.0" }
img_core = { package = "jflib-img-core", path = "lib/img_core", version = "=0.1.0" }
