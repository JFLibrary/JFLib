opt-level = 2

[profile.dev.package.jflib-img-av1]
opt-level = 2

[profile.dev.package.jflib-img-heif]
opt-level = 2

[profile.dev.package.jflib-img-avif]
opt-level = 2

[profile.dev.package.jflib-img-jxl]
