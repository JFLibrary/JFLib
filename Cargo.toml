modplat = { package = "jflib-modplat", path = "modules/modplat", version = "=0.1.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(jfgui_assets)',    # ui::main!: the app has assets/
    'cfg(jfgui_dev)',       # lib/ui/build.rs: a development build
    'cfg(jfgui_glibc)',     # Linux against glibc, not static
    'cfg(jfgui_manifest)',  # ui::main!, rt::main!: PERMISSIONS as a file
    'cfg(jfgui_package)',   # ui::main!: PACKAGE as a file
    'cfg(jflib_module)',    # inside a loadable module
    'cfg(web_threads)',     # the browser with threads
    'cfg(jflib_style, values("winui", "classic", "kde", "macos"))',
] }

# What a project needs as well, Cargo does not take profiles from a dependency (docs/CRATES.md).
[profile.dev]
panic = "abort"
opt-level = 1
debug = 0
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
lto = "fat"
debug = 0
strip = "symbols"
