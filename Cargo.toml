doc_core = { package = "jflib-doc-core", path = "lib/doc_core", version = "=0.1.0" }
doc_layout = { package = "jflib-doc-layout", path = "lib/doc_layout", version = "=0.1.0" }
doc_io = { package = "jflib-doc-io", path = "lib/doc_io", version = "=0.1.0" }
img_png = { package = "jflib-img-png", path = "lib/img_png", version = "=0.1.0" }
