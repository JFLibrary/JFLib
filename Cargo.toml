style_winui = { package = "jflib-style-winui", path = "styles/winui", version = "=0.1.0" }
style_classic = { package = "jflib-style-classic", path = "styles/classic", version = "=0.1.0" }
style_kde = { package = "jflib-style-kde", path = "styles/kde", version = "=0.1.0" }
