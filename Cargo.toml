[profile.dev.package.jflib-img-svg]
opt-level = 2

[profile.dev.package.jflib-img-all]
opt-level = 2

[profile.dev.package.Kritzel]
opt-level = 2

[profile.dev.package.PaintCraft]
opt-level = 2

# text_shape and the crates it pins from crates.io: optimised as build_rs.py's earlier Cargo build of them did
[profile.dev.package."*"]
opt-level = 2
codegen-units = 1

[profile.dev.package.jflib-text-shape]
opt-level = 2
codegen-units = 1

# a module links with fat LTO in development builds too (build_rs.py, jxl-module): at a compute crate's level
[profile.dev.package.jflib-module-jxlenc]
opt-level = 2


[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
lto = "fat"
debug = 0
strip = "symbols"
