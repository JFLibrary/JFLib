# The library's crates, the apps of this repository, their programs and crates, PaintCraft's Rust
# plugins.  Cargo builds them; build_rs.py is the tool on top that reads what it needs from here
# (tools/manifests.py).  docs/CRATES.md is the plan.
[workspace]
resolver = "3"
# worktrees below this folder may be older than this file, build/ holds test projects: their
# Cargo.toml are not members of it
exclude = [".claude", "build"]
default-members = ["lib/jflib"]
# lib/ in this order is build_rs.py's LIBS: a program's crates link in it
members = [
    "lib/rt",
    "lib/agent_core",
    "lib/plat",
    "lib/base",
    "lib/agent_io",
    "lib/simd",
    "lib/gfx",
