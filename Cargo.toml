# The one version of the library (rt::VERSION; `build_rs.py release` writes it, docs/VERSIONING.md)
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JFLibrary/JFLib"

# Exact versions: only the way through the crate jflib is promised, the crates below it change together.
[workspace.dependencies]
rt = { package = "jflib-rt", path = "lib/rt", version = "=0.1.0" }
agent_core = { package = "jflib-agent-core", path = "lib/agent_core", version = "=0.1.0" }
plat = { package = "jflib-plat", path = "lib/plat", version = "=0.1.0" }
