img_gif = { package = "jflib-img-gif", path = "lib/img_gif", version = "=0.1.0" }
img_tga = { package = "jflib-img-tga", path = "lib/img_tga", version = "=0.1.0" }
img_tiff = { package = "jflib-img-tiff", path = "lib/img_tiff", version = "=0.1.0" }
img_webp = { package = "jflib-img-webp", path = "lib/img_webp", version = "=0.1.0" }
img_hevc = { package = "jflib-img-hevc", path = "lib/img_hevc", version = "=0.1.0" }
img_av1 = { package = "jflib-img-av1", path = "lib/img_av1", version = "=0.1.0" }
img_heif = { package = "jflib-img-heif", path = "lib/img_heif", version = "=0.1.0" }
img_avif = { package = "jflib-img-avif", path = "lib/img_avif", version = "=0.1.0" }
