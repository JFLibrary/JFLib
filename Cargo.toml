plugin = { package = "jflib-plugin", path = "lib/plugin" }
style_jfoffice = { package = "jflib-style-jfoffice", path = "styles/jfoffice" }
style_backupcraft = { package = "jflib-style-backupcraft", path = "styles/backupcraft" }
style_netlab = { package = "jflib-style-netlab", path = "styles/netlab" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(jfgui_assets)',    # ui::main!: the app has assets/
    'cfg(jfgui_dev)',       # lib/ui/build.rs: a development build
    'cfg(jfgui_glibc)',     # Linux against glibc, not static
    'cfg(jfgui_manifest)',  # ui::main!, rt::main!: PERMISSIONS as a file
    'cfg(jfgui_package)',   # ui::main!: PACKAGE as a file
    'cfg(jflib_module)',    # inside a loadable module
    'cfg(web_threads)',     # the browser with threads
    'cfg(jflib_style, values("winui", "classic", "kde", "macos"))',
] }

# What a project needs as well, Cargo does not take profiles from a dependency (docs/CRATES.md).
[profile.dev]
panic = "abort"
opt-level = 1
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16
# as build_rs.py links every program; no effect on the crates of a project outside (its own profile counts)
strip = "symbols"

# the crates whose speed matters in development builds too (build_rs.py's compute_crate): pixels and
# codecs stay fast in the tests, Kritzel and PaintCraft draw with their own pixel loops
[profile.dev.package.jflib-gfx]
opt-level = 2

[profile.dev.package.jflib-text]
opt-level = 2

[profile.dev.package.jflib-simd]
opt-level = 2

[profile.dev.package.jflib-fx]
opt-level = 2

[profile.dev.package.jflib-crypto]
opt-level = 2

[profile.dev.package.jflib-compress]
opt-level = 2

[profile.dev.package.jflib-cas]
opt-level = 2

[profile.dev.package.jflib-spell]
opt-level = 2

[profile.dev.package.jflib-img-core]
opt-level = 2

[profile.dev.package.jflib-img-png]
opt-level = 2

[profile.dev.package.jflib-img-jpeg]
opt-level = 2

[profile.dev.package.jflib-img-bmp]
opt-level = 2

