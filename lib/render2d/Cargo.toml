[package]
name = "jflib-render2d"
description = "The core of JFLib's 2D renderer for CAD on jflib-gpu: a retained scene of lines, polylines, arcs and circles, Bézier curves, ellipses, splines, fills and hatches with layers and styles, dash patterns, strokes and fills with analytic coverage, f64 coordinates, visibility on the GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "render2d"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
gpu.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
