[package]
name = "jflib-render2d"
description = "The core of JFLib's 2D renderer for CAD on jflib-gpu: a retained scene of lines, polylines, arcs and circles, Bézier curves, ellipses, splines, fills and hatches with layers and styles, dash patterns, text from an atlas of multi-channel distance fields, strokes and fills with analytic coverage, f64 coordinates, visibility on the GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "render2d"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
gpu.workspace = true
# the CPU path (G6e1): the scene drawn through lib/gfx's rasterizer without a device
gfx.workspace = true
# (its row bands on lib/gfx's parallel loop: a spin lock per band)
rt.workspace = true
# fonts (outlines, metrics) and shaping (HarfRust, bidi) for text (G6c)
text.workspace = true
text_shape.workspace = true
# DXF drawings into a scene (G6e2): the reader without a GPU, mapped in dxf.rs
dxf.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
