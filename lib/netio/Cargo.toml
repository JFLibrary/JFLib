[package]
name = "jflib-netio"
description = "Network protocols on top of JFLib's platform layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "netio"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
crypto.workspace = true
x509.workspace = true
formats.workspace = true
# the stream decoders of Content-Encoding
compress.workspace = true
# the cookie jar (with the public suffix list)
netpkt.workspace = true

# docs.rs: Windows, Linux and Android (plat has no network in the browser), not docs.rs's five defaults
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-linux-android"]
