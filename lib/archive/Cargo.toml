[package]
name = "jflib-archive"
description = "In-memory ZIP reading and writing (DEFLATE, ZIP64) and OPC packages for JFLib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "archive"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# plat: ZipFs (vfs); base: XML of the OPC packages (opc)
rt.workspace = true
img_core.workspace = true
plat.workspace = true
base.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
