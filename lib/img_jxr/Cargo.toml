[package]
name = "jflib-img-jxr"
description = "JPEG XR decoder and encoder for JFLib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND BSD-2-Clause"
repository.workspace = true
homepage.workspace = true

[lib]
name = "img_jxr"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
simd.workspace = true
gfx.workspace = true
img_core.workspace = true
plat.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
