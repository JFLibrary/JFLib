[package]
name = "jflib-text-shape"
description = "OpenType shaping and Unicode bidi for JFLib, on pinned no_std crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "text_shape"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
harfrust = { version = "=0.14.0", default-features = false, features = ["libm"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-script = { version = "=0.5.8", default-features = false }

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
