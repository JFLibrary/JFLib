[package]
name = "jflib-text-shape"
description = "OpenType shaping and Unicode bidi for JFLib, on pinned no_std crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "text_shape"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
harfrust = { version = "=0.14.0", default-features = false, features = ["libm"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-script = { version = "=0.5.8", default-features = false }
