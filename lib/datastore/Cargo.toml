[package]
name = "jflib-datastore"
description = "An embedded, crash-safe store of JSON records with a write-ahead log, snapshots, secondary indexes and encryption at rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "datastore"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
crypto.workspace = true
formats.workspace = true

# docs.rs: Windows, Linux and Android (plat has no files in the browser), not docs.rs's five defaults
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-linux-android"]
