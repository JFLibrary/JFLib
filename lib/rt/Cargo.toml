[package]
name = "jflib-rt"
description = "JFLib's runtime without std: allocator, memory intrinsics, program entry, panic handling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
links = "jflib_rt"
build = "build.rs"

[lib]
name = "rt"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[features]
# a program with the standard library (docs/CRATES.md, CR6): std's panic handler, allocator, memory
# functions and entry; rt::panic_hook gives std's panics JFLib's crash report, rt::Alloc is rt's
# allocator on request.  Cargo turns it on for the whole program (jflib's feature std).
std = []
# (with std) a program built with panic = "unwind" (docs/GUIDE.md, "An app with std"): a panic the app's
# code catches (std::panic::catch_unwind) leaves the program running; rt::panic_hook reports a panic only
# when it leaves JFLib's threads and entry points uncaught (rt::abort_on_unwind)
unwind = ["std"]

[dependencies]

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet);
# with std, so plat::std_start and rt::panic_hook show and Linux shows the glibc build that windows use
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
features = ["std"]
