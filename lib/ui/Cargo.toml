[package]
name = "jflib-ui"
description = "JFLib's immediate-mode GUI runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
repository.workspace = true
homepage.workspace = true
build = "build.rs"
exclude = ["tests"]

[lib]
name = "ui"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[features]
# a program with the standard library (docs/CRATES.md, CR6): ui::main! also defines fn main
std = ["rt/std", "plat/std"]
# (with std) a program built with panic = "unwind": ui::main! no longer asks for panic = "abort"
unwind = ["std", "rt/unwind", "plat/unwind"]

[dependencies]
# datetime: dates in the locale's format; spell: TB_SPELL; img_svg: ui.svg, image_view
rt.workspace = true
base.workspace = true
gfx.workspace = true
text.workspace = true
plat.workspace = true
img_core.workspace = true
img_png.workspace = true
img_all.workspace = true
agent_core.workspace = true
agent_io.workspace = true
datetime.workspace = true
spell.workspace = true
img_svg.workspace = true

# The UI's output through the GPU: Windows, Linux in the build against glibc, Android, macOS and the browser
# (WebGPU, no Vulkan code in its bundles).  The static Linux build links nothing of it: gpu_out_off.rs.
# On Linux for every build: a program with std is the glibc build through ui's build script, which
# Cargo's [target] tables cannot see (only --cfg in rustflags); the facade compiles gpu anyway.
[target.'cfg(windows)'.dependencies]
shader.workspace = true
gpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
shader.workspace = true
gpu.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
shader.workspace = true
gpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
shader.workspace = true
gpu.workspace = true

# macOS and iOS: Metal (docs/APPLE.md AP6); the output on macOS, 3D views on both
[target.'cfg(target_os = "macos")'.dependencies]
shader.workspace = true
gpu.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
shader.workspace = true
gpu.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's);
# with std, so plat::std_start and rt::panic_hook show and Linux shows the glibc build that windows use
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
features = ["std"]
