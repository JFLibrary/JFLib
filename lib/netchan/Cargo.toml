[package]
name = "jflib-netchan"
description = "Message channels for games: UDP with sequence numbers and acks, WebSocket, the browser's network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "netchan"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
crypto.workspace = true

# the desktop's WebSocket client and the server: Windows, Linux, macOS and iOS (netio is not built for
# the browser and Android; one table per target, as build_rs.py reads them: tools/manifests.py)
[target.'cfg(windows)'.dependencies]
netio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
netio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
netio.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
netio.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
