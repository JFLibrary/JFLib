[package]
name = "jflib-gltf"
description = "glTF 2.0 import for JFLib (.gltf and .glb): meshes, materials, textures, images, nodes in f64, without a GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "gltf"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
agent_core.workspace = true
img_core.workspace = true
img_png.workspace = true
img_jpeg.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
