[package]
name = "jflib-diagram-core"
description = "the diagram model: ShapeSheet cells, formulas, geometry, routing and layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "diagram_core"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# base: the XML subset (base::xml, the report definitions' XML, report/xml.rs); after the merge
# with main it is formats::xml, base::xml re-exports it until 0.3.0
base.workspace = true

# the unit tests (cargo test --lib): a test binary has std's start, panic handler and allocator
[dev-dependencies]
rt = { workspace = true, features = ["std"] }
plat = { workspace = true, features = ["std"] }

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
