[package]
name = "jflib-diagram-core"
description = "the diagram model: ShapeSheet cells, formulas, geometry, routing and layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "diagram_core"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# (JD21) the Boolean operations on plane regions (geom::region) for the shape operations; geom needs
# only rt
geom.workspace = true

# the unit tests run with std's test harness: rt (through geom) without its own panic handler
[dev-dependencies]
rt = { workspace = true, features = ["std"] }

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
