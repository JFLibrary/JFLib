[package]
name = "jflib-gpu"
description = "GPU access for JFLib: an explicit API over Vulkan and WebGPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "gpu"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[features]
# a program with the standard library (docs/CRATES.md, CR6): on Linux the glibc build, as plat's
std = ["plat/std"]

[dependencies]
# shader: shader::reflect (pipeline constants)
rt.workspace = true
plat.workspace = true
shader.workspace = true
