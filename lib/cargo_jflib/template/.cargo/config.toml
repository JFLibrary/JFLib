# What a build script cannot set (README.md of the crate jflib).  rust-lld comes with rustup.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Linux needs nothing here: a program with a window links against glibc through cc, as every Rust
# program does (the GPU drivers are glibc libraries), so `cargo run` is all it takes.  A
# command-line program can be one static file instead: these two lines, and always build it with
# --target x86_64-unknown-linux-gnu, also on Linux (the flags must not reach the build scripts and
# proc macros).
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
