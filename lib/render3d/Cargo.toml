[package]
name = "jflib-render3d"
description = "The core of JFLib's 3D engine on jflib-gpu: meshes, textured materials, scenes of instances, visibility on the GPU, glTF scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "render3d"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
gpu.workspace = true
gltf.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
