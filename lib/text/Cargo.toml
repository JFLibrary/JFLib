[package]
name = "jflib-text"
description = "JFLib's text: fonts, synthetic styles, colour glyphs, the glyph cache, text runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND FTL AND Unicode-3.0"
repository.workspace = true
homepage.workspace = true

[lib]
name = "text"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
plat.workspace = true
base.workspace = true
simd.workspace = true
gfx.workspace = true
img_core.workspace = true
img_png.workspace = true
text_shape.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
