[package]
name = "jflib-gfx"
description = "JFLib's 2D graphics: surfaces, the draw context, fills, blits, paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
homepage.workspace = true

[lib]
name = "gfx"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
simd.workspace = true

# inside a loadable module (--cfg jflib_module) the same names are modrt and modplat
[target.'cfg(not(jflib_module))'.dependencies]
rt.workspace = true

[target.'cfg(jflib_module)'.dependencies]
modrt.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
