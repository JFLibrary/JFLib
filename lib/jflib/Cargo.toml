[package]
name = "jflib"
description = "A GUI library and everything it stands on, without the standard library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
readme = "README.md"
# docs/ is copied in from the repository's docs/ before packing (tools/crates_accept.py), not kept in git
include = ["src/**", "build.rs", "README.md", "LICENSE-*", "docs/*.md", "template/**"]

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
agent_core.workspace = true
plat.workspace = true
base.workspace = true
agent_io.workspace = true
