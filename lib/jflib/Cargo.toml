doc_layout.workspace = true
doc_io.workspace = true
img_png.workspace = true
text_shape.workspace = true
text.workspace = true
img_jpeg.workspace = true
img_bmp.workspace = true
img_gif.workspace = true
img_tga.workspace = true
img_tiff.workspace = true
img_webp.workspace = true
img_hevc.workspace = true
img_av1.workspace = true
img_heif.workspace = true
img_avif.workspace = true
img_jxl.workspace = true
img_jxr.workspace = true
img_dds.workspace = true
img_pdn.workspace = true
fx.workspace = true
img_svg.workspace = true
img_all.workspace = true
spell.workspace = true
