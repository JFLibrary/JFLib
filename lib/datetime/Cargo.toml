[package]
name = "jflib-datetime"
description = "Calendar time without std: timestamps, civil dates, RFC 3339, time zones, cron schedules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
repository.workspace = true
homepage.workspace = true

[lib]
name = "datetime"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
