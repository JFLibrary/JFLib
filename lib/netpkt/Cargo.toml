[package]
name = "jflib-netpkt"
description = "Network packets byte for byte: addresses, checksums, header codecs, a dissector, pcapng; no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "netpkt"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# crypto: ssh
crypto.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
