[package]
name = "jflib-doc-view"
description = "Document presentation for JFLib: stable fonts, pagination measurement, page drawing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND Bitstream-Vera"
repository.workspace = true
homepage.workspace = true

[lib]
name = "doc_view"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
rt.workspace = true
doc_core.workspace = true
doc_layout.workspace = true
gfx.workspace = true
text.workspace = true
ui.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
