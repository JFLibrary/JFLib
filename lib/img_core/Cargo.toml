[package]
name = "jflib-img-core"
description = "The shared part of JFLib's image codecs: records, error codes, DEFLATE, colour management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND (MIT OR Unlicense) AND Zlib AND MIT"
repository.workspace = true
homepage.workspace = true

[lib]
name = "img_core"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
simd.workspace = true
gfx.workspace = true

# inside a loadable module (--cfg jflib_module) the same names are modrt and modplat
[target.'cfg(not(jflib_module))'.dependencies]
rt.workspace = true

[target.'cfg(jflib_module)'.dependencies]
modrt.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
