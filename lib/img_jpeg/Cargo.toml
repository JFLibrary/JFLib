[package]
name = "jflib-img-jpeg"
description = "JPEG decoder and encoder for JFLib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND IJG AND BSD-3-Clause AND Zlib AND (MIT OR Unlicense)"
repository.workspace = true

[lib]
name = "img_jpeg"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
simd.workspace = true
gfx.workspace = true
img_core.workspace = true

# inside a loadable module (--cfg jflib_module) the same names are modrt and modplat
[target.'cfg(not(jflib_module))'.dependencies]
rt.workspace = true

[target.'cfg(jflib_module)'.dependencies]
modrt.workspace = true
