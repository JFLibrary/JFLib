[package]
name = "jflib-style-assets"
description = "The fonts and the icon set JFLib's styles share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND MIT"
repository.workspace = true
homepage.workspace = true

[lib]
name = "style_assets"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
