[package]
name = "jflib-style-winui"
description = "JFLib's WinUI 3 (Fluent) style"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
exclude = ["assets/*.ttf"]

[lib]
name = "style_winui"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ui.workspace = true
style_assets.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
