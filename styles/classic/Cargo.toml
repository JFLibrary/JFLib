[package]
name = "jflib-style-classic"
description = "JFLib's classic style: the look of Windows 2000 and Office 97"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND Bitstream-Vera"
repository.workspace = true
homepage.workspace = true

[lib]
name = "style_classic"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ui.workspace = true
style_assets.workspace = true

# docs.rs: Linux, Windows, the browser and Android, not docs.rs's five defaults (32-bit Windows is none
# of JFLib's targets; macOS and iOS are, their pages are not built on docs.rs yet)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
