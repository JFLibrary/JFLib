[package]
name = "jflib-style-netlab"
description = "JFLib's NetLab style: sober grey surfaces, clear borders, compact (the look of JFNetworker)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "style_netlab"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
text.workspace = true
ui.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
