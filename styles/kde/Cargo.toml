[package]
name = "jflib-style-kde"
description = "JFLib's KDE Plasma (Breeze) style"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND Bitstream-Vera"
repository.workspace = true
homepage.workspace = true
exclude = ["states"]     # the state scripts of docs/STYLES.md, in no program

[lib]
name = "style_kde"
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ui.workspace = true
style_assets.workspace = true

# docs.rs: JFLib's four targets, not docs.rs's five defaults (macOS and 32-bit Windows are none of JFLib's)
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android"]
